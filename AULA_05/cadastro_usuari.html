<!DOCTYPE html>

<html lang="pt-br">

	<head>	
	
		<meta challenge ="utf-8">
		<title>Cadastro de Usuario</title>
		
	<head>
	
	<body>
	
		<!--Criar formulario-->
		<!--<form> - tag de formulario atributo action aponta para uma página atributo method-->
		
		<form action ="#" method="POST" >
		
			<!--label == rótulo do campo-->
			
			<label>Nome completo:</label><br>
			
			<!--campo de entrada de dados
			type == tipo do campo
			id == indentificador para javascript
			name == indentificador PHP-->
			
			<input type="text" id="nome" name="nome" >
			<br><br>
		
			<!-- isso cria um botão -->
			<input type="submit" value="Cadastrar">
			
		</form>
			
	</body>
	
</html>
