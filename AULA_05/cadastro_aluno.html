<!DOCTYPE html>

<html lang="pt-br">

	<head>	
	
		<meta charset="utf-8">
		<title>Cadastro de Aluno</title>
		
	<head>
	
	<body>
	
		<h1 style="text-align: center">Cadastro de Aluno</h1>
		<hr>
	
		<form action ="#" method="POST" >
			
			<label for="nome">Nome do Aluno: </label><br>
			<input type="text" id="nome" name="nome" placeholder="Nome do Aluno..." minlength="3" maxlength="255" required>
			<br><br>
			
			<label for="ra">Registro(RA) do Aluno: </label><br>
			<input type="text" id="ra" name="ra" value="20261015" disabled>
			<br><br>
			
			<label for="email">E-mail do Aluno: </label><br>
			<input type="email" id="email" name="email" placeholder="Emai@Email.com..." required>
			<br><br>
			
			<label for="telefone">Telefone do Aluno: </label><br>
			<input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
			<br><br>
			
			<label for="data_nascimento">Data de nascimento do Aluno: </label><br>
			<input type="date" id="data_nascimento" name="data nascimento" max="2009-01-01"required>
			<br><br>
			
			<label for="idade">Idade do Aluno: </label><br>
			<input type="number" id="idade" name="idade" min="17" max="100"  placeholder="123..." required>
			<br><br>
			
			<label for="genero">Genero do Aluno: </label><br><br>
			<input type="radio" id="masculino" name="gernero" value="Masculino" required>Masculino<br>
			<input type="radio" id="feminino" name="gernero" value="Feminino" >Feminino<br>
			<input type="radio" id="Outros" name="gernero" value="Outros" >Outros
			<br><br>
			
			<label for="turma">Selecione a turma do Aluno: </label><br>
			<select name="turma" id="turma" required>
				
				
				<option value="">Selecione...</option>
				<option value="1EMA">1º EM-A</option>
				<option value="1EMB">1º EM-B</option>
				<option value="2EMA">2º EM-A</option>
				<option value="2EMB">2º EM-B</option>
				<option value="3EMA">3º EM-A</option>
				<option value="3EMB">3º EM-B</option>
			
			</select>
			<br><br>
			
			<label for="foto">Foto do Aluno:</label><br>
			<input type="file" id="foto" name="nome" required>
			<br><br>
			
			<label for="comentarios">Comentarios: </label><br>
			<textarea id="comentarios" name="comentarios" placeholder="Texto..."></textarea>
			<br><br>
			
			<input type="checkbox" id="termos" name="termos" required >li e aceito os termos e condição<br>
			<input type="checkbox" id="notificacoes" name="notificacoes">Aceita receber notificações
			
			<br><br>
			
			<input type="submit" value="Cadastrar aluno">
			
		</form>
			
	</body>
	
</html>
