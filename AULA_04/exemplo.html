<!DOCTYPE html>
<html lang="pt-br">

	<head>
	
		<meta charset="UTF-8">
		<title>Exemplo 02 - Table</title>
		
		<body>
		
			<Table border ="1" width="100%">
			
				<tr style="background-color:purple; color: white">
				
					<th>Cabeçalho 1</th>
					<th>Cabeçalho 2</th>
					<th>Cabeçalho 3</th>
					
				</tr>
				
				<tr>
				
					<td style="background-color:#000;color:#fff;">Conteudo 1</td>
					<td>
					
						<Table  border ="1" width="100%">
						
							<tr>
							
								<td style="background-color:yellow; color: #000">1</td>
								<td style="background-color:red; color: #fff; text-align:right">2</td>
							
							</tr>
							
							<tr>
							
								<td style="background-color:blue; color: #fff; text-align:right">3</td>
								<td style="background-color:green; color: #000">4</td>
							
							</tr>
						
						</Table>
					
					</td>
					<td style="background-image:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSifa2GIbWaO7qlNwEyJqg3Kes07fIY0zQqWtqEiN_xfzMNdWoL7vID1GDp&s=10');color:#000;">Conteudo 3</td>
					
				</tr>
				
				<tr>
				
					<td style="background-color:#000;color:#fff;">Conteudo 4</td>
					<td style="background-image:url('https://static.vecteezy.com/ti/vetor-gratis/p1/2173503-abstrato-azul-listrado-linha-serrilhada-padrao-sobre-fundo-branco-e-textura-vetor.jpg')">Conteudo 5</td>
					<td>
					
						<Table  border ="1" width="100%">
						
							<tr>
							
								<td style="background-color:orange; color: #000; text-align:center">5</td>
								<td style="background-color:pink; color: #000">6</td>
							
							</tr>
							
							<tr>
							
								<td style="background-color:#BB1B80; color: #000; text-align:right">7</td>
								<td style="background-color:orange; color: #000; text-align:center"">8</td>
							
							</tr>
						
						</Table>
					
					</td>
				
				</tr>
				
			
			</Table>
		
		</body>
	
	</head>

</html>
